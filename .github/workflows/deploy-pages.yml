name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages site (client + assets)
        run: |
          mkdir -p _site
          # client/assets is a symlink to ../assets — dereference it (-L) so
          # the real asset files land in _site instead of a broken symlink.
          # Excludes dev-only files (node_modules, package*.json) that have
          # no business in a shipped static site.
          rsync -aL --exclude node_modules --exclude 'package*.json' client/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
