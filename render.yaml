services:
  - type: web
    name: harvest-hollow-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        # Comma-separated allow-list of client origins permitted to connect
        # (GitHub Pages origin + local dev). Update if the Pages URL changes.
        value: https://hakd0g23.github.io,http://localhost:5173
